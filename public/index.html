<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Base</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      border-bottom: 1px solid #2e2e2e;
      color: #fff;
      display: flex;
      align-items: center;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.5;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      background: #2f6feb;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.assistant {
      align-self: flex-start;
      background: #2a2a2a;
      color: #e8e8e8;
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: center;
      background: transparent;
      color: #666;
      font-size: 12px;
      padding: 4px 0;
    }

    .sources {
      margin-top: 8px;
      font-size: 12px;
      color: #888;
    }

    #input-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #2e2e2e;
      background: #1a1a1a;
    }

    #upload-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid #444;
      background: transparent;
      color: #aaa;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      line-height: 1;
    }

    #upload-btn:hover { border-color: #888; color: #fff; }

    #question {
      flex: 1;
      background: #2a2a2a;
      border: 1.5px solid #3a3a3a;
      border-radius: 20px;
      padding: 9px 16px;
      color: #e8e8e8;
      font-size: 14px;
      outline: none;
      resize: none;
      max-height: 120px;
      overflow-y: auto;
    }

    #question:focus { border-color: #2f6feb; }

    #send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: #2f6feb;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #send-btn:disabled { background: #333; color: #555; cursor: default; }

    #file-input { display: none; }

    .typing {
      align-self: flex-start;
      background: #2a2a2a;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 5px;
    }

    .typing span {
      width: 7px; height: 7px;
      background: #666;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }
  </style>
</head>
<body>

<header>
  Knowledge Base
  <a href="/analytics.html" style="margin-left:auto;font-size:12px;color:#666;text-decoration:none;">Analytics →</a>
</header>

<div id="chat">
  <div class="msg system">Ask anything from your knowledge base, or upload a file to add to it.</div>
</div>

<div id="input-bar">
  <button id="upload-btn" title="Upload file">+</button>
  <input type="file" id="file-input" accept=".pdf,.docx,.doc,.txt,.md,.csv" />
  <textarea id="question" rows="1" placeholder="Ask a question..."></textarea>
  <button id="send-btn">&#9650;</button>
</div>

<script>
  const chat      = document.getElementById("chat");
  const input     = document.getElementById("question");
  const sendBtn   = document.getElementById("send-btn");
  const uploadBtn = document.getElementById("upload-btn");
  const fileInput = document.getElementById("file-input");

  function addMsg(role, text, sources) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.textContent = text;
    if (sources && sources.length) {
      const s = document.createElement("div");
      s.className = "sources";
      s.textContent = "Sources: " + sources.join(", ");
      div.appendChild(s);
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  function addTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  // Auto-resize textarea
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = input.scrollHeight + "px";
  });

  // Send on Enter (Shift+Enter for newline)
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendQuestion();
    }
  });

  sendBtn.addEventListener("click", sendQuestion);

  async function sendQuestion() {
    const question = input.value.trim();
    if (!question) return;

    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;

    addMsg("user", question);
    const typing = addTyping();

    try {
      const res = await fetch("/api/query", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });
      const data = await res.json();
      typing.remove();
      if (data.error) {
        addMsg("system", "Error: " + data.error);
      } else {
        addMsg("assistant", data.answer, data.sources);
      }
    } catch (err) {
      typing.remove();
      addMsg("system", "Network error. Please try again.");
    }

    sendBtn.disabled = false;
    input.focus();
  }

  // File upload
  uploadBtn.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    if (!file) return;
    fileInput.value = "";

    addMsg("system", `Uploading "${file.name}"...`);

    const formData = new FormData();
    formData.append("file", file);

    try {
      // Step 1: upload
      const upRes = await fetch("/api/upload", { method: "POST", body: formData });
      const upData = await upRes.json();
      if (upData.error) { addMsg("system", "Upload failed: " + upData.error); return; }

      addMsg("system", `Processing "${file.name}"...`);

      // Step 2: ingest
      const ingRes = await fetch("/api/ingest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: upData.path }),
      });
      const ingData = await ingRes.json();
      if (ingData.error) { addMsg("system", "Ingest failed: " + ingData.error); return; }

      addMsg("system", `Added to knowledge base: "${ingData.title}" [${ingData.tags.join(", ")}]`);
    } catch (err) {
      addMsg("system", "Upload error. Please try again.");
    }
  });
</script>

</body>
</html>
